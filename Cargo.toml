[workspace]
resolver = "2"
members = ["rust/longctx100m-core", "rust/longctx100m-cli", "rust/longctx100m-gateway", "rust/longctx100m-importer", "rust/longctx100m-model"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }
tempfile = "3"
subtle = "2.6"
safetensors = "0.4.5"
tokenizers = { version = "0.21.1", default-features = false, features = ["onig"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
memmap2 = "0.9.8"
candle-core = "0.8.4"
candle-nn = "0.8.4"
half = "2.7"
rand = "0.9"
